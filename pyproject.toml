[project]
name = "deltaguard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Deepak Upadhayay", email = "dd79dy@inf.elte.hu" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
deltaguard = "deltaguard:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
